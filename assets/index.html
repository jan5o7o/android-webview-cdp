<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So7o Android Webview Shell</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:24px; font:15px/1.5 -apple-system,Roboto,sans-serif;
         background:#101418; color:#e6edf3; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:20px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .k { color:#8b949e; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .v { font-size:15px; word-break:break-all; }
  #hit { font-size:34px; font-weight:600; color:#58a6ff; }
  button { font:inherit; padding:9px 16px; border-radius:8px; border:1px solid #30363d;
           background:#21262d; color:#e6edf3; }
  #cdp { color:#3fb950; }
  .tag { display:inline-block; background:#1f6feb22; color:#58a6ff; border:1px solid #1f6feb55;
         border-radius:999px; padding:1px 9px; font-size:12px; }
</style>
</head>
<body>
  <h1>So7o Android Webview Shell</h1>
  <div class="sub">loaded from <code>file:///android_asset/index.html</code>
    &nbsp;<span class="tag" id="dbg">debug socket on</span></div>

  <div class="card">
    <div class="k">taps</div>
    <div id="hit">0</div>
  </div>

  <div class="card">
    <div class="k">last CDP command</div>
    <div class="v" id="cdp">— nothing from CDP yet —</div>
  </div>

  <div class="card">
    <div class="k">app bridge (so7o.ping())</div>
    <div class="v" id="bridge">—</div>
  </div>

  <div class="card">
    <div class="k">camera — getUserMedia (front + back)</div>
    <div class="v">live front/back sensor, served by this phone over HTTPS</div>
    <p style="margin:10px 0 0">
      <button onclick="location.href='https://z.so7o.dev/camera/'">open /camera →</button>
    </p>
  </div>

  <button onclick="hit()">tap me (proves the page is live)</button>

<script>
  var n = 0;
  function hit() {
    n++;
    document.getElementById('hit').textContent = n;
    console.log('tap #' + n);
    return n;
  }

  // A stable handle for Runtime.evaluate from CDP.
  window.__so7o = {
    shell: 'webview-shell',
    taps: function () { return n; },
    say: function (msg) {
      document.getElementById('cdp').textContent = msg;
      console.log('CDP said: ' + msg);
      return 'shown: ' + msg;
    }
  };

  document.getElementById('bridge').textContent =
      (typeof so7o !== 'undefined' && so7o.ping) ? so7o.ping() : '(no bridge)';
  console.log('webview-shell ready, title=' + document.title);
</script>
</body>
</html>
